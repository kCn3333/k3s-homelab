apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    alloy:
      configMap:
        content: |-
          logging {
            level = "info"
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

      storagePath: /var/lib/alloy

      mounts:
        varlog: true
        dockercontainers: false
        extra:
          - name: alloy-storage
            mountPath: /var/lib/alloy

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    controller:
      type: daemonset

      volumes:
        extra:
          - name: alloy-storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate

      initContainers:
        - name: prepare-storage
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              chown -R 65534:0 /var/lib/alloy
              chmod 0750 /var/lib/alloy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: alloy-storage
              mountPath: /var/lib/alloy
