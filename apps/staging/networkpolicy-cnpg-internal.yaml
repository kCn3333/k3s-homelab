apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clients-db-staging-allow-cnpg-internal
  namespace: clients-staging
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: clients-db-staging
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: clients-db-staging
      ports:
        - protocol: TCP
          port: 5432
